name: E2E (Android)

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      CI: '1'
      # Dummy Firebase config keeps UI tests independent of production credentials.
      GOOGLE_SERVICES_JSON: ${{ github.workspace }}/.maestro/google-services.e2e.json
      # AdMob is referenced in app.config.js; a dummy value is fine for E2E.
      ADMOB_APPID: ca-app-pub-0000000000000000~0000000000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/yarn.lock', 'app.config.js') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        # Release is signed with the debug keystore (see android/app/build.gradle).
        # Release-mode is required: debug mode triggers Metro/dev-server lookups
        # and the dev support manager can reload the React instance mid-boot,
        # which crashes through an expo-av ExoPlayer teardown race.
        # Lint tasks are skipped — they fail on harmless translation keys.
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  android:
    name: Maestro on Android emulator
    needs: build
    runs-on: ubuntu-latest

    env:
      CI: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: e2e-android-apk
          path: android/app/build/outputs/apk/release

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            # The action executes each line in a separate shell.
            bash scripts/run-maestro.sh

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ github.run_id }}
          path: |
            ~/.maestro/tests/**
            /tmp/maestro-screenshots
          if-no-files-found: ignore
          retention-days: 7

appId: com.valabji.zikr
name: Azkar list opens, search toggles, and clears
---
- launchApp:
    clearState: true
- runFlow: subflows/complete-first-time.yaml
# Land on Favorites; switch to "All Azkar" via the drawer.
- tapOn:
    id: "menu-button"
- extendedWaitUntil:
    visible:
      id: "main-screen"
    timeout: 5000
- tapOn:
    id: "main-screen"
- extendedWaitUntil:
    visible:
      id: "search-toggle"
    timeout: 10000
- tapOn:
    id: "search-toggle"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 5000
- inputText: "test"
- assertVisible:
    id: "clear-search"
- tapOn:
    id: "clear-search"
- tapOn:
    id: "close-search"
- assertVisible:
    id: "search-toggle"

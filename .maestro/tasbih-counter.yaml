appId: com.valabji.zikr
name: Tasbih counter increments on tap
---
- launchApp:
    clearState: true
- runFlow: subflows/complete-first-time.yaml
- tapOn:
    id: "menu-button"
- extendedWaitUntil:
    visible:
      id: "screen3"
    timeout: 5000
- tapOn:
    id: "screen3"
- extendedWaitUntil:
    visible:
      id: "tasbih-screen"
    timeout: 10000
- assertVisible:
    id: "tasbih-counter-value"
    text: "0"
- tapOn:
    id: "tasbih-counter-button"
- tapOn:
    id: "tasbih-counter-button"
- tapOn:
    id: "tasbih-counter-button"
- assertVisible:
    id: "tasbih-counter-value"
    text: "3"

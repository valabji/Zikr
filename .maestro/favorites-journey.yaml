appId: com.valabji.zikr
name: Favorites journey — landing, search, azkar-detail, drawer, fav-toggle, contribute
# Covers: first-time-to-home, favorites-default-shows-seeded, menu-button-on-favorites,
# search-from-favorites, azkar-detail-from-favorites, azkar-detail-back-to-favorites,
# drawer-opens, drawer-open-close, fav-toggle-then-untoggle,
# drawer-favorites-to-contribute, contribute-screen, contribute-back-to-home,
# contribute-from-favorites-back.
---
- launchApp:
    clearState: true
- runFlow: subflows/complete-first-time.yaml
# first-time-to-home + favorites-default-shows-seeded + menu-button-on-favorites
- assertVisible:
    id: "home-screen"
- assertVisible:
    id: "zikr-item"
- assertNotVisible:
    id: "empty-favorites"
- assertVisible:
    id: "menu-button"
- assertVisible:
    id: "search-toggle"
- assertNotVisible:
    id: "back-button"
# search-from-favorites — open the search header from the Favorites view and close it.
- tapOn:
    id: "search-toggle"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 5000
- assertVisible:
    id: "close-search"
- tapOn:
    id: "close-search"
- extendedWaitUntil:
    visible:
      id: "search-toggle"
    timeout: 5000
# azkar-detail-from-favorites + azkar-detail-back-to-favorites — tap a fav zikr, then back.
- tapOn:
    id: "zikr-item"
    index: 0
- extendedWaitUntil:
    visible:
      id: "azkar-detail-container"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000
- assertVisible:
    id: "search-toggle"
# Check the current scrollable drawer.
- tapOn:
    id: "menu-button"
- runFlow: subflows/assert-drawer-items.yaml
# drawer-open-close — system back closes the drawer and returns to home.
- back
- extendedWaitUntil:
    visible:
      id: "menu-button"
    timeout: 5000
- assertVisible:
    id: "home-screen"
# fav-toggle-then-untoggle — tap fav twice on whatever sits at index 0.
- assertVisible:
    id: "fav-toggle"
- tapOn:
    id: "fav-toggle"
    index: 0
- tapOn:
    id: "fav-toggle"
    index: 0
# Favorites is a header filter; toggle to All Azkar and back.
- tapOn:
    id: "favorites-toggle"
- assertVisible:
    id: "zikr-item"
- tapOn:
    id: "favorites-toggle"
- assertVisible:
    id: "zikr-item"
# Contribute is reached through About, then back through About to Favorites.
- runFlow: subflows/contribute-roundtrip.yaml
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000
- assertVisible:
    id: "menu-button"

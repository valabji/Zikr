appId: com.valabji.zikr
name: Theme dropdown opens from Settings
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "theme-dropdown-trigger"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "theme-dropdown-trigger"
# The modal renders into a Modal — Maestro should still see it.
# Theme keys: originalGreen, goldOnWhite, goldOnDark, paige, chocolate, lavender.
# We just verify the modal opened by checking that the trigger is no longer the
# only thing on screen. Closing the modal: tap the backdrop (parent TouchableOpacity).
- waitForAnimationToEnd:
    timeout: 3000
- back
- assertVisible:
    id: "theme-dropdown-trigger"
